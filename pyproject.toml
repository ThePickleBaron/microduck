[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "microduck-pretrain"
version = "0.1.0"
description = "Pre-train Microduck skills in simulation and measure deployment readiness on delivery (IDAI 600 semester project)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Pinned to 3.12 to match the vendored training stack (bam requires <3.13).
requires-python = ">=3.12, <3.13"
dependencies = [
    # The vendored Pollen Robotics training stack (mjlab + MuJoCo Warp + PPO).
    "mjlab-microduck",
    # Mirrors the vendored project's pin so uv resolves the same wheel.
    "torch==2.9.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Registers this project's experiment-condition tasks with mjlab, next to the
# vendored Microduck tasks. Both plugins load whenever `train` runs.
[project.entry-points."mjlab.tasks"]
microduck_pretrain = "microduck_pretrain.tasks"

[project.scripts]
md-check = "microduck_pretrain.check_env:main"
md-train = "microduck_pretrain.train:main"
md-eval = "microduck_pretrain.evaluate:main"
md-report = "microduck_pretrain.report:main"
md-conditions = "microduck_pretrain.conditions:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds simulator configs or runs physics (deselect with -m \"not slow\")"]

# ---------------------------------------------------------------------------
# uv settings. The first block is copied from third_party/microduck_rl's
# pyproject.toml (uv applies these only from the ROOT project, so they must be
# repeated here). Keep them in sync when updating the vendored copy — see
# VENDORED.md.
# ---------------------------------------------------------------------------
[tool.uv]
override-dependencies = [
    "protobuf>=4.0,<7.0",
    "onnx>=1.20.1",
    "zmq ; python_version < '3.0'",
]

